name: Room directory Kotlin Multiplatform
on:
  pull_request:
    paths:
      - 'packages/room-directory/**'
      - '.github/workflows/room-directory-kmp.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shared:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            task: jvmTest
          - os: macos-15
            task: iosSimulatorArm64Test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - run: gradle --no-daemon -p packages/room-directory :shared:${{ matrix.task }}
